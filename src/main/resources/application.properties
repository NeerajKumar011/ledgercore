spring.application.name=ledgercore
server.port=8081

# ---------------------------------------------------------------------------
# Load variables from .env (git-ignored) when it exists.
# Spring Boot 2.4+ supports this natively via spring.config.import.
# The "optional:" prefix means startup does NOT fail when .env is absent
# (e.g. in CI where env-vars are injected directly).
# "[.properties]" tells Spring Boot to parse the file as Java-properties
# key=value pairs — which is exactly the format Docker Compose .env uses.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Datasource — all values come from .env (or real env vars in prod).
# No password default: fail fast if POSTGRES_PASSWORD is unset.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# validate: Hibernate checks the schema matches entities but does NOT modify it.
#           Flyway owns all DDL.
# open-in-view: false eliminates lazy-loading through the HTTP request thread
#               and suppresses the Boot startup warning.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Timezone: force Hibernate to bind all JDBC timestamps in UTC so the JDBC
# driver does not forward the JVM timezone (Asia/Calcutta) to PostgreSQL.
# ---------------------------------------------------------------------------
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
